[data]
root = "data/pcam"
batch_size = 128
workers = 4
augmentation = "pathology"
normalize = "pcam"

[model]
name = "small_cnn"

[model.parameters]
width = 32
dropout = 0.25

[optimizer]
name = "adamw"
learning_rate = 0.0003
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 5

[training]
mode = "supervised"
epochs = 100
seed = 17
patience = 20
robust_loss = "bce"

[output]
experiment_name = "e00-smallcnn-control"

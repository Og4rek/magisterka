[data]
root = "data/pcam"
batch_size = 96
workers = 4
augmentation = "pathology"
normalize = "pcam"

[model]
name = "resnet50"
pretrained = false

[optimizer]
name = "adamw"
learning_rate = 0.0003
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 5

[training]
mode = "supervised"
epochs = 100
seed = 17
patience = 20

[output]
experiment_name = "e03-resnet50-scratch"

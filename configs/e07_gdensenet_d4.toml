# Rotation Equivariant CNNs for Digital Pathology (Veeling et al.).
[data]
root = "data/pcam"
batch_size = 32
eval_batch_size = 16
workers = 4
augmentation = "minimal"
normalize = "pcam"

[model]
name = "gdensenet_d4"

[model.parameters]
initial_channels = 16
growth_rate = 8
block_layers = [3, 4, 5]
compression = 0.5
dropout = 0.2

[optimizer]
name = "adam"
learning_rate = 0.0001
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 5

[training]
mode = "supervised"
epochs = 100
seed = 17
patience = 20

[output]
experiment_name = "e07-gdensenet-d4"

# Partial G-CNN / learned rotational symmetry reproduction track.
[data]
root = "data/pcam"
batch_size = 16
workers = 4
augmentation = "minimal"
normalize = "pcam"

[model]
name = "partial_se2"

[model.parameters]
orientations = 16
channels = [12, 20, 32]
gate_regularization = 0.0001
dropout = 0.2

[optimizer]
name = "adamw"
learning_rate = 0.0002
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 5

[training]
mode = "supervised"
epochs = 100
seed = 17
patience = 20

[output]
experiment_name = "e08-partial-se2-c16"

# Supervised low-label baseline for the Mean Teacher comparison.
[data]
root = "data/pcam"
batch_size = 64
eval_batch_size = 256
workers = 4
labeled_fraction = 0.05
augmentation = "pathology"
normalize = "imagenet"

[model]
name = "inception_v3"
pretrained = true

[optimizer]
name = "adam"
learning_rate = 0.0001
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 3

[training]
mode = "supervised"
epochs = 80
seed = 17
patience = 15

[output]
experiment_name = "e09-inception-supervised-5pct"

# Contrastive pretraining stage; downstream evaluation uses e11a and e11b.
[data]
root = "data/pcam"
batch_size = 256
workers = 8
augmentation = "simclr"
normalize = "imagenet"

[model]
name = "resnet50"
pretrained = false

[model.parameters]
projection_dim = 128

[optimizer]
name = "adamw"
learning_rate = 0.0003
weight_decay = 0.000001

[scheduler]
name = "cosine"
warmup_epochs = 10

[training]
mode = "simclr"
epochs = 200
seed = 17
patience = 200
temperature = 0.2

[output]
experiment_name = "e11-simclr-resnet50"
save_predictions = false

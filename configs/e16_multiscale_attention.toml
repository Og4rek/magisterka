[data]
root = "data/pcam"
batch_size = 64
eval_batch_size = 64
workers = 4
augmentation = "pathology"
normalize = "imagenet"

[model]
name = "multiscale_attention"
pretrained = true

[model.parameters]
encoder = "resnet18"
encoder_pretrained = true
scales = [0.75, 1.0, 1.25]
share_encoder = true
attention_dim = 128
dropout = 0.2

[optimizer]
name = "adamw"
learning_rate = 0.0001
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 3

[training]
mode = "supervised"
epochs = 80
seed = 17
patience = 15

[output]
experiment_name = "e16-multiscale-attention"

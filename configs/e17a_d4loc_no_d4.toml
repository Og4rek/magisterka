# Ablation A: replace D4 convolutions with ordinary convolutions.
[data]
root = "data/pcam"
batch_size = 128
eval_batch_size = 512
workers = 8
augmentation = "pathology"
normalize = "pcam"

[model]
name = "pcam_d4loc"

[model.parameters]
initial_channels = 8
growth_rate = 4
stage_layers = [2, 2, 2]
transition_channels = [16, 24]
fusion_channels = 48
dropout = 0.15
center_fraction = 0.3333333333333333
lse_beta = 4.0
use_d4 = false
center_pooling = true
multiscale = true

[optimizer]
name = "adamw"
learning_rate = 0.0003
weight_decay = 0.0001

[scheduler]
name = "cosine"
warmup_epochs = 5
minimum_learning_rate = 0.000001

[training]
mode = "supervised"
epochs = 100
seed = 17
amp = true
gradient_clip_norm = 1.0
monitor = "auc_roc"
patience = 20

[output]
experiment_name = "e17a-d4loc-no-d4"

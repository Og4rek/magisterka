[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcam-repro"
version = "0.1.0"
description = "Reproducible PyTorch benchmarks for PatchCamelyon metastasis classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Piotr Łyczko"}]
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.26",
  "h5py>=3.10",
  "Pillow>=10.0",
  "tensorboard>=2.18",
  "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/Og4rek/magisterka"
Issues = "https://github.com/Og4rek/magisterka/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
analysis = ["matplotlib>=3.10"]
compile = [
  "torch>=2.12,<2.14",
  "torchvision>=0.27,<0.29",
  "triton-windows==3.7.1.post27; sys_platform == 'win32'",
]

[project.scripts]
pcam-repro = "pcam_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
